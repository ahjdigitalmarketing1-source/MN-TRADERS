name: Update invoice branding

on:
  push:
    paths:
      - '.github/workflows/update-invoice-brand.yml'

permissions:
  contents: write

jobs:
  update-invoice:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update invoice tagline and remove temporary workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<div><h2>M.N Traders</h2><b>Sales Invoice / Bill</b></div>'
          new = '<div><h2>M.N Traders</h2><div style="font-weight:900;font-size:16px;letter-spacing:.2px">NEXT COLA — Quality You Can Trust</div><b>Sales Invoice / Bill</b></div>'
          if old not in s:
              raise SystemExit('Invoice header pattern not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/update-invoice-brand.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/update-invoice-brand.yml
          git commit -m "Add NEXT COLA invoice tagline"
          git push