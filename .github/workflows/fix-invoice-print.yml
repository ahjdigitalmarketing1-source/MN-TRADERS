name: Fix invoice printing

on:
  push:
    paths:
      - '.github/workflows/fix-invoice-print.yml'

permissions:
  contents: write

jobs:
  fix-print:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update print CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='''@media print{\n  .hero,.nav,.status,.no-print,button{display:none!important}\n  body{background:#fff}.layout{display:block;padding:0}.panel{box-shadow:none;border:0}\n  .invoice,.receipt{border:0;max-width:none}\n}'''
          new='''@media print{\n  body{background:#fff!important}\n  body *{visibility:hidden!important}\n  .invoice,.invoice *{visibility:visible!important}\n  .receipt,.receipt *{visibility:visible!important}\n  .invoice,.receipt{position:absolute!important;left:0!important;top:0!important;width:100%!important;max-width:none!important;margin:0!important;border:0!important;border-radius:0!important;box-shadow:none!important;padding:12mm!important;background:#fff!important}\n  .invoice .no-print,.receipt .no-print{display:none!important}\n}'''
          if old not in s:
              raise SystemExit('print CSS pattern not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          rm .github/workflows/fix-invoice-print.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/fix-invoice-print.yml
          git commit -m 'Print invoice only without page content'
          git push